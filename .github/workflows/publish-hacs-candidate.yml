name: Publish HACS Candidate

on:
  push:
    branches:
      - fix/authenticated-public-prices-isolation
    paths:
      - custom_components/frank_energie/**
      - pyproject.toml
      - tests/**

permissions:
  contents: write
  actions: read

concurrency:
  group: frank-energie-hacs-candidate
  cancel-in-progress: false

jobs:
  publish:
    name: Qualified HACS pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require patch branch, fixed version, and pinned API library
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/authenticated-public-prices-isolation"
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          manifest = json.loads(Path('custom_components/frank_energie/manifest.json').read_text())
          project = tomllib.loads(Path('pyproject.toml').read_text())
          assert manifest['version'] == '2026.10.21.2', 'Unexpected version: do not silently republish'
          assert manifest['version'] == project['tool']['poetry']['version']
          assert manifest['requirements'] == ['python-frank-energie==2026.9.20']
          assert json.loads(Path('hacs.json').read_text())['zip_release'] is True
          assert json.loads(Path('hacs.json').read_text())['filename'] == 'frank_energie.zip'
          print('PASS immutable HACS test candidate identity')
          PY

      - name: Require exact-commit Validate and Ruff PASS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 65); do
            RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=pull_request&per_page=50")
            RESULTS=$(printf '%s' "$RUNS" | python3 -c '
          import json,sys
          runs=json.load(sys.stdin)["workflow_runs"]
          for name in ("Validate", "Ruff"):
              match=next((r for r in runs if r["name"] == name), {})
              print(f"{name}={match.get(chr(99)+chr(111)+chr(110)+chr(99)+chr(108)+chr(117)+chr(115)+chr(105)+chr(111)+chr(110)) or chr(112)+chr(101)+chr(110)+chr(100)+chr(105)+chr(110)+chr(103)}")
          ')
            echo "$RESULTS"
            if printf '%s\n' "$RESULTS" | grep -Fxq "Validate=success" && printf '%s\n' "$RESULTS" | grep -Fxq "Ruff=success"; then
              echo "PASS exact SHA ${GITHUB_SHA} validated"
              exit 0
            fi
            if printf '%s\n' "$RESULTS" | grep -Eq "^(Validate|Ruff)=(failure|cancelled|timed_out|action_required)$"; then
              echo "BLOCK: a required workflow failed at exact SHA"
              exit 1
            fi
            sleep 12
          done
          echo "BLOCK: timed out awaiting exact-commit checks"
          exit 1

      - name: Create exact-runtime ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          runtime=Path('custom_components/frank_energie')
          output=Path('dist/frank_energie.zip')
          with ZipFile(output,'w') as z:
              for p in sorted(runtime.rglob('*')):
                  if not p.is_file() or '__pycache__' in p.parts or p.suffix == '.pyc':
                      continue
                  item=ZipInfo(p.relative_to(runtime).as_posix(), date_time=(2020,1,1,0,0,0))
                  item.compress_type=ZIP_DEFLATED
                  item.external_attr=0o644 << 16
                  z.writestr(item,p.read_bytes())
          digest=hashlib.sha256(output.read_bytes()).hexdigest()
          Path('dist/SHA256SUMS.txt').write_text(f'{digest}  frank_energie.zip\n')
          print(f'PASS ZIP created: {output}, sha256={digest}')
          PY

      - name: Publish immutable test-only GitHub pre-release with ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v2026.10.21.2
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "BLOCK: release already exists; immutable candidate versions cannot be republished"
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "BLOCK: tag already exists; refusing to move it"
            exit 1
          fi
          cat > /tmp/notes.md <<EOF
          ## TEST CANDIDATE — not a stable release

          Fix candidate for `MarketPrices` GraphQL validation failures when a
          Belgian Home Assistant Frank Energie integration is authenticated.

          - Public market-price queries are sent without the account bearer token.
          - Customer-specific queries continue to use the authenticated client.
          - Includes source regression coverage for Belgium, France and Netherlands.
          - GitHub CI Validate/Ruff qualified this exact commit: ${GITHUB_SHA}.
          - **Not yet verified against a live authenticated BE account.**

          This ZIP is provided exclusively for controlled Home Assistant testing.
          Back up the existing custom component before installing.
          Do not consider this a production-approved or upstream release.
          EOF
          gh release create "$TAG" dist/frank_energie.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Frank Energie 2026.10.21.1 — HACS TEST" \
            --notes-file /tmp/notes.md \
            --prerelease
          echo "Published test-only pre-release $TAG from $GITHUB_SHA"
