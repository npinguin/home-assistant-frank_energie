name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  source:
    permissions:
      contents: read
    name: Source, tests and package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14.2 is the minimum Python version pyproject.toml declares
        # support for; 3.14 tracks the latest 3.14.x patch release.
        python-version: ["3.14.2", "3.14"]

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # @v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            raw.githubusercontent.com:443
            github.com:443
            install.python-poetry.org:443
            pypi.org:443
            files.pythonhosted.org:443
            sonarcloud.io:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
            upload.pypi.org:443
            test.pypi.org:443
            codecov.io:443
            uploader.codecov.io:443
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7

        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # @v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Poetry
        run: |
          set -o pipefail
          curl -sSL https://install.python-poetry.org | python3 -
          echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV

      - name: Install dependencies with Poetry
        run: |
          poetry install
          if [ -f requirements.txt ]; then poetry run pip install -r requirements.txt; fi

      - name: Register flake8 problem matcher
        run: echo "::add-matcher::.github/workflows/flake8-matchers.json"

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --max-line-length=120 --statistics
        continue-on-error: true

      - name: Test with pytest
        run: |
          poetry run pytest -v --capture=no

      - name: Verify manifest release identity
        run: |
          poetry run python - <<'PY'
          import json
          import pathlib
          import tomllib
          manifest = json.loads(pathlib.Path('custom_components/frank_energie/manifest.json').read_text())
          metadata = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          assert manifest['version'] == metadata['tool']['poetry']['version']
          assert manifest['requirements'] == ['python-frank-energie==2026.9.20']
          print('PASS consistent release identity and pinned Python client')
          PY

      - name: Build unqualified HACS test package
        if: github.event_name == 'pull_request' && matrix.python-version == '3.14'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('custom_components/frank_energie')
          output = Path('dist/frank_energie-hacs-test.zip')
          with ZipFile(output, 'w', ZIP_DEFLATED) as archive:
              for entry in sorted(root.rglob('*')):
                  if entry.is_file() and '__pycache__' not in entry.parts and entry.suffix != '.pyc':
                      archive.write(entry, entry.relative_to(root))
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          Path('dist/SHA256SUMS.txt').write_text(f'{digest}  {output.name}\n')
          print(f'PASS test package SHA256={digest}')
          PY

      - name: Upload unqualified HACS test package
        if: github.event_name == 'pull_request' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frank-energie-hacs-test-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: |
            dist/frank_energie-hacs-test.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate HACS package
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6

  gate:
    name: Frank Energie / Validate
    if: always()
    needs: [source, hacs, hassfest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require authoritative validation gates
        env:
          SOURCE: ${{ needs.source.result }}
          HACS: ${{ needs.hacs.result }}
          HASSFEST: ${{ needs.hassfest.result }}
        run: |
          set -euo pipefail
          test "$SOURCE" = success
          test "$HACS" = success
          test "$HASSFEST" = success
