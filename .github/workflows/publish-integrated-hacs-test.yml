name: Publish Integrated BE HACS Test

on:
  push:
    branches:
      - release/hacs-be-2026.10.31.1
    paths:
      - custom_components/frank_energie/**
      - pyproject.toml
      - tests/**
      - docs/candidates/2026.10.31.1.md
      - .github/workflows/publish-integrated-hacs-test.yml

permissions:
  contents: write
  actions: read

concurrency:
  # Each commit is independent; stale heads are rejected immediately
  # before tag creation, so an older pending run cannot block a newer one.
  group: frank-energie-integrated-be-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Qualified HACS pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require exact release branch, version, and pinned client
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/release/hacs-be-2026.10.31.1"
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          manifest = json.loads(Path('custom_components/frank_energie/manifest.json').read_text())
          project = tomllib.loads(Path('pyproject.toml').read_text())
          assert manifest['version'] == '2026.10.31.1', 'Unexpected version: do not silently republish'
          assert manifest['version'] == project['tool']['poetry']['version']
          assert manifest['requirements'] == ['python-frank-energie==2026.9.20']
          assert json.loads(Path('hacs.json').read_text())['zip_release'] is True
          assert json.loads(Path('hacs.json').read_text())['filename'] == 'frank_energie.zip'
          print('PASS immutable HACS test candidate identity')
          PY

      - name: Require exact-commit pytest, Quality and Links PASS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 65); do
            RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=pull_request&per_page=50")
            RESULTS=$(printf '%s' "$RUNS" | python3 -c '
          import json,sys
          runs=json.load(sys.stdin)["workflow_runs"]
          for name in ("Flake8 and pytest", "Quality Scale Validation", "Link Check"):
              match=next((r for r in runs if r["name"] == name), {})
              print(f"{name}={match.get(chr(99)+chr(111)+chr(110)+chr(99)+chr(108)+chr(117)+chr(115)+chr(105)+chr(111)+chr(110)) or chr(112)+chr(101)+chr(110)+chr(100)+chr(105)+chr(110)+chr(103)}")
          ')
            echo "$RESULTS"
            if printf '%s\n' "$RESULTS" | grep -Fxq "Flake8 and pytest=success" && \
               printf '%s\n' "$RESULTS" | grep -Fxq "Quality Scale Validation=success" && \
               printf '%s\n' "$RESULTS" | grep -Fxq "Link Check=success"; then
              echo "PASS exact SHA ${GITHUB_SHA} validated"
              exit 0
            fi
            if printf '%s\n' "$RESULTS" | grep -Eq "^(Flake8 and pytest|Quality Scale Validation|Link Check)=(failure|cancelled|timed_out|action_required)$"; then
              echo "BLOCK: a required workflow failed at exact SHA"
              exit 1
            fi
            sleep 12
          done
          echo "BLOCK: timed out awaiting exact-commit checks"
          exit 1

      # The separate Ruff workflow can remain in GitHub's pending queue without
      # a runner. Still require the identical pinned lint+format checks *inside*
      # this exact-SHA publisher before any release asset is created.
      - name: Ruff lint (exact candidate)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          version: "0.15.18"
          args: "check custom_components tests"

      - name: Ruff format (exact candidate)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          version: "0.15.18"
          args: "format --check --diff custom_components tests"

      - name: HACS release structure validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

      - name: Hassfest Home Assistant validation
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6

      - name: Create exact-runtime ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          runtime=Path('custom_components/frank_energie')
          output=Path('dist/frank_energie.zip')
          with ZipFile(output,'w') as z:
              for p in sorted(runtime.rglob('*')):
                  if not p.is_file() or '__pycache__' in p.parts or p.suffix == '.pyc':
                      continue
                  item=ZipInfo(p.relative_to(runtime).as_posix(), date_time=(2020,1,1,0,0,0))
                  item.compress_type=ZIP_DEFLATED
                  item.external_attr=0o644 << 16
                  z.writestr(item,p.read_bytes())
          digest=hashlib.sha256(output.read_bytes()).hexdigest()
          Path('dist/SHA256SUMS.txt').write_text(f'{digest}  frank_energie.zip\n')
          print(f'PASS ZIP created: {output}, sha256={digest}')
          PY

      - name: Publish immutable test-only GitHub pre-release with ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only the currently reviewed candidate head may create this tag.
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/release/hacs-be-2026.10.31.1" --jq '.object.sha')
          if [ "$CURRENT_SHA" != "$GITHUB_SHA" ]; then
            echo "BLOCK: stale candidate SHA ${GITHUB_SHA}; latest is ${CURRENT_SHA}"
            exit 1
          fi
          TAG=v2026.10.31.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "BLOCK: release already exists; immutable candidate versions cannot be republished"
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "BLOCK: tag already exists; refusing to move it"
            exit 1
          fi
          cat > /tmp/notes.md <<EOF
          ## Integrated Belgian HACS TEST — not a stable release

          Complete Frank Energie integration ZIP for controlled Home Assistant testing.
          Exact qualified commit: ${GITHUB_SHA}.

          - Preserves synchronized upstream core and existing entity identities.
          - BE public prices use a separate credential-free API client; customer prices retain authentication.
          - MODEL offer, SMR3 electricity, SMR1 gas and null contract ENUM values are handled.
          - Anonymous-to-login reconfigure chooses and validates delivery site before updating the entry.
          - Optional monthly electricity/gas/feed-in finances and provider expectations, default OFF.
          - Last-month retry and optional endpoint failure isolation; no fictitious zeros or capacity tariff.
          - Diagnostics now separate live price and statistics/finance evidence.
          - Privacy fixes prevent raw config entry and site-data logging.
          - Exact SHA CI, Ruff, Quality Scale, Link Check, HACS and Hassfest checks required before this tag.

          Known limitation: python-frank-energie==2026.9.20 cannot distinguish
          missing month amounts from a true zero. Ambiguous zero values remain
          unavailable pending source-client issue #11. Real BE account/month
          reconciliation and HA Recorder runtime proof remain to be performed.

          Read docs/candidates/2026.10.31.1.md on the tagged commit for full
          acceptance, installation and rollback. This is not a stable release.
          EOF
          gh release create "$TAG" dist/frank_energie.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Frank Energie 2026.10.31.1 — BE INTEGRATED HACS TEST" \
            --notes-file /tmp/notes.md \
            --prerelease
          echo "Published test-only pre-release $TAG from $GITHUB_SHA"
