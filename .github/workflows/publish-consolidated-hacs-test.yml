name: Publish Consolidated BE HACS Test

# One release publisher on the one active PR #18 branch.
# Adding/changing ordinary code cannot publish unexpectedly; only the
# version-specific contract test commit can trigger this candidate.
on:
  push:
    branches:
      - fix/be-price-provenance-truth
    paths:
      - tests/test_hacs_candidate_2026_11_1_1.py

permissions:
  contents: write
  actions: read

concurrency:
  group: frank-energie-consolidated-2026-11-1-1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Qualified consolidated HACS TEST 2026.11.1.1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check single-train source identity, versions and pinned client
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/be-price-provenance-truth"
          python3 - <<'PY'
          from pathlib import Path
          import json
          import tomllib
          manifest = json.loads(Path("custom_components/frank_energie/manifest.json").read_text())
          project = tomllib.loads(Path("pyproject.toml").read_text())
          hacs = json.loads(Path("hacs.json").read_text())
          version = "2026.11.1.1"
          assert manifest["version"] == version
          assert project["tool"]["poetry"]["version"] == version
          assert f'VERSION: Final[str] = "{version}"' in Path(
              "custom_components/frank_energie/const.py"
          ).read_text()
          assert manifest["requirements"] == ["python-frank-energie==2026.9.20"]
          assert hacs["zip_release"] is True
          assert hacs["filename"] == "frank_energie.zip"
          assert Path("docs/candidates/2026.11.1.1.md").is_file()
          assert Path("tests/test_hacs_candidate_2026_11_1_1.py").is_file()
          print("PASS: exact single-train HACS candidate identity")
          PY

      - name: Reject stale release train commits before CI polling
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/fix/be-price-provenance-truth" --jq '.object.sha')
          if [ "$GITHUB_SHA" != "$CURRENT_SHA" ]; then
            echo "BLOCK: newer release-train commit exists; this publisher is stale"
            exit 1
          fi

      - name: Require all exact-SHA PR CI workflows green before packaging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 95); do
            RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=pull_request&per_page=100")
            RESULTS=$(printf '%s' "$RUNS" | python3 -c '
          import json, sys
          runs = json.load(sys.stdin)["workflow_runs"]
          for name in ("Flake8 and pytest", "Ruff", "Quality Scale Validation", "Link Check"):
              matches = [r for r in runs if r.get("name") == name]
              latest = max(matches, key=lambda r: r.get("id", 0), default={})
              print(name + "=" + str(latest.get("conclusion") or "pending"))
          ')
            printf '%s\n' "$RESULTS"
            if printf '%s\n' "$RESULTS" | grep -Fxq "Flake8 and pytest=success" && \
               printf '%s\n' "$RESULTS" | grep -Fxq "Ruff=success" && \
               printf '%s\n' "$RESULTS" | grep -Fxq "Quality Scale Validation=success" && \
               printf '%s\n' "$RESULTS" | grep -Fxq "Link Check=success"; then
              echo "PASS exact-SHA CI: $GITHUB_SHA"
              exit 0
            fi
            if printf '%s\n' "$RESULTS" | grep -Eq '^(Flake8 and pytest|Ruff|Quality Scale Validation|Link Check)=(failure|cancelled|timed_out|action_required)
              echo "BLOCK: required exact-SHA check is red"
              exit 1
            fi
            sleep 9
          done
          echo "BLOCK: required exact-SHA checks never completed"
          exit 1

      - name: Pinned Ruff lint again on exact candidate
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.15.18"
          args: "check custom_components tests"

      - name: Pinned Ruff format again on exact candidate
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.15.18"
          args: "format --check --diff custom_components tests"

      - name: HACS integration validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

      - name: Hassfest Home Assistant validation
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6

      - name: Generate deterministic full integration ZIP and SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          root = Path("custom_components/frank_energie")
          dest = Path("dist/frank_energie.zip")
          paths = [
              path for path in sorted(root.rglob("*"))
              if path.is_file() and "__pycache__" not in path.parts and path.suffix != ".pyc"
          ]
          assert paths, "Empty package"
          with ZipFile(dest, "w") as output:
              for path in paths:
                  rel = path.relative_to(root).as_posix()
                  assert not rel.startswith("/") and ".." not in Path(rel).parts
                  info = ZipInfo(rel, date_time=(2020, 1, 1, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o644 << 16
                  output.writestr(info, path.read_bytes())
          with ZipFile(dest) as archive:
              names = archive.namelist()
              assert len(names) == len(set(names)), "Duplicate ZIP paths"
              assert "manifest.json" in names and "const.py" in names
              assert "diagnostics.py" in names and "coordinator.py" in names
              assert json.loads(archive.read("manifest.json"))["version"] == "2026.11.1.1"
              assert archive.testzip() is None, "Corrupt ZIP"
          digest = hashlib.sha256(dest.read_bytes()).hexdigest()
          Path("dist/SHA256SUMS.txt").write_text(f"{digest}  frank_energie.zip\n")
          print(f"PASS: deterministic ZIP {dest}, {len(paths)} files, SHA256 {digest}")
          PY

      - name: Publish immutable HACS pre-release (never stable)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v2026.11.1.1
          CURRENT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/fix/be-price-provenance-truth" --jq '.object.sha')
          if [ "$GITHUB_SHA" != "$CURRENT_SHA" ]; then
            echo "BLOCK: stale commit; active release train has moved"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "BLOCK: release already exists; never overwrite test assets"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "BLOCK: immutable Git tag already exists"
            exit 1
          fi
          cat > /tmp/frank-test-notes.md <<'EOF'
          ## Frank Energie 2026.11.1.1 — consolidated BE HACS TEST ONLY

          A complete, immutable ZIP for controlled real Home Assistant validation.
          Source branch: the single Draft release PR #18, not stable/main.

          - Fixes selected delivery site subscription flags in the price
            coordinator, including multiple-site isolation.
          - Distinguishes customer/public/mixed/cache/empty price provenance.
          - Reads Belgian MODEL contract metadata from actual Python-client
            Connection dataclasses, preserving privacy.
          - Adds price slot counts by Brussels-local day and an active-today
            cache diagnostic separate from the legacy cache flag.
          - Preserves existing config entry, entity identities and Recorder
            mapping. No extra provider polling or duplicated energy integration.
          - Includes v2026.10.31.2 GraphQL request observability and
            previous Belgian integration fixes, plus CI workflow governance.
          - Python 3.14/3.14.2, Ruff, Quality/Links, HACS and Hassfest gates
            required before publishing this test ZIP.

          **Important limits:** monthly finance stays opt-in OFF. The pinned
          python-frank-energie==2026.9.20 parser cannot distinguish missing
          invoice/meter values from true zero (#11). A Belgian MODEL contract
          is variable, not a public spot-indexed dynamic contract. The prior
          account diagnostic showed only 6 next-day customer gas price
          records; actual time coverage and invoice reconciliation are not
          established by slot counts. No stable promotion without live
          HA / HACS / Recorder verification.

          Install the entire frank_energie.zip asset through the existing
          fork's HACS custom repository and restart Home Assistant. Download
          diagnostics privately after a normal refresh. Do not enable
          python_frank_energie: debug with real credentials. Roll back to the
          **entire** immutable v2026.10.31.2 integration if needed; do not
          delete config entries or rename sensors.

          See docs/candidates/2026.11.1.1.md on this exact tag for the
          stepwise test plan and release gate. Open fixes continue on PR #18.
          EOF
          gh release create "$TAG" dist/frank_energie.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Frank Energie 2026.11.1.1 — CONSOLIDATED BE HACS TEST" \
            --notes-file /tmp/frank-test-notes.md \
            --prerelease
          RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          printf '%s' "$RELEASE" | python3 -c '
          import json,sys
          r=json.load(sys.stdin)
          assert r["prerelease"] is True and r["draft"] is False
          assert r["tag_name"] == "v2026.11.1.1"
          assert {a["name"] for a in r["assets"]} == {
              "frank_energie.zip", "SHA256SUMS.txt"
          }
          print("PASS: immutable HACS prerelease and two assets confirmed")
          '
; then
              echo "BLOCK: required exact-SHA check is red"
              exit 1
            fi
            sleep 9
          done
          echo "BLOCK: required exact-SHA checks never completed"
          exit 1

      - name: Pinned Ruff lint again on exact candidate
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.15.18"
          args: "check custom_components tests"

      - name: Pinned Ruff format again on exact candidate
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.15.18"
          args: "format --check --diff custom_components tests"

      - name: HACS integration validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration

      - name: Hassfest Home Assistant validation
        uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6

      - name: Generate deterministic full integration ZIP and SHA256
        shell: bash
        run: |
          set -euo pipefail
